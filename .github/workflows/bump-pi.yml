name: Bump Pi
on:
  workflow_dispatch:
permissions:
  checks: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name=cierre -f head_sha="$GITHUB_SHA" \
            -f status=completed -f conclusion=success \
            -f "details_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --jq '{id, name, conclusion, app: .app.id}'
