name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  cierre:
    runs-on: ubuntu-latest
    env:
      # Los tests de install.sh abren zsh, bash y fish nuevos: acá, que falte uno es un fallo.
      OMI_REQUIRE_SHELLS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: npm ci
      - run: npm run typecheck
      # Pi baja fd y rg de github.com si no están en el PATH; npm test no sale a la red.
      # zsh y fish: los shells nuevos que abren los tests de install.sh.
      - run: sudo apt-get -o Acquire::Retries=3 update -qq && sudo apt-get -o Acquire::Retries=3 install -y -qq --no-install-recommends ripgrep fd-find zsh fish
      - run: npm test
      - run: npm run test:packaging
