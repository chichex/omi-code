name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  cierre:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: npm ci
      - run: npm run typecheck
      # Pi baja fd y rg de github.com si no están en el PATH; npm test no sale a la red.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ripgrep fd-find
      - run: npm test
      - run: npm run test:packaging
