# Publica una release por cada merge a main que cambie lo empaquetado.
# La versión la decide scripts/next-release.ts; el tag es la fuente de verdad y
# package.json sólo se estampa acá, sin commitear: main no recibe pushes de bots.
# La decisión humana es el merge. Un dispatch sirve para verificar o reintentar.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Corre todo menos publicar; fuerza una versión aunque no haya cambios empaquetados
        type: boolean
        default: true

permissions:
  contents: read

# La corrida siguiente calcula desde el tag nuevo: los merges seguidos se agrupan, no se pisan.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - id: next
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            node scripts/next-release.ts --force >> "$GITHUB_OUTPUT"
          else
            node scripts/next-release.ts >> "$GITHUB_OUTPUT"
          fi

  # CI sólo arranca el binario de Linux; macOS tiene fallas propias (exit 137 sin refirmar).
  macos:
    needs: plan
    if: needs.plan.outputs.version != ''
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: npm ci
      - run: npm version "$VERSION" --no-git-tag-version --allow-same-version
      - run: npm run test:packaging

  build:
    needs: [plan, macos]
    if: needs.plan.outputs.version != ''
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: npm ci
      - run: npm version "$VERSION" --no-git-tag-version --allow-same-version
      - run: npm run typecheck
      # Pi baja fd y rg de github.com si no están en el PATH; npm test no sale a la red.
      - run: sudo apt-get -o Acquire::Retries=3 update -qq && sudo apt-get -o Acquire::Retries=3 install -y -qq --no-install-recommends ripgrep fd-find
      - run: npm test
      - run: npm run test:packaging
      - run: node scripts/build-release.ts --out dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/release
          if-no-files-found: error
          retention-days: 1

  # test:packaging compila aparte para el host. Esto arranca lo que se publica, compilado desde Linux.
  boot:
    needs: [plan, build]
    if: needs.plan.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: ${{ runner.temp }}/release
      - name: Instalar con install.sh
        run: OMI_INSTALL_BASE="file://$RUNNER_TEMP/release" sh "$RUNNER_TEMP/release/install.sh"
      - name: Arrancan el binario suelto y el del bundle
        run: |
          if [ "$(head -c 2 "$HOME/.omi/bin/omi")" = '#!' ]; then
            echo "install.sh cayó al bundle: el binario suelto no arranca" >&2
            exit 1
          fi
          file "$HOME/.omi/bin/omi"
          [ "$("$HOME/.omi/bin/omi" --version)" = "$VERSION" ]
          [ "$("$HOME/.omi/runtime/omi" --version)" = "$VERSION" ]
          # fd y rg van en el runtime para que Pi no los baje; en macOS Intel llegan sin firma.
          "$HOME/.omi/runtime/bin/fd" --version
          "$HOME/.omi/runtime/bin/rg" --version
      - name: Pi responde por RPC y la instalación viene sin skills
        run: |
          ( printf '{"id":"1","type":"get_commands"}\n'; sleep 20 ) | "$HOME/.omi/bin/omi" --mode rpc --no-session > "$RUNNER_TEMP/rpc.out" || true
          [ ! -e "$HOME/.omi/runtime/skills" ]
          # Exige la respuesta: si omi no contesta, también hay cero skills.
          grep '^{' "$RUNNER_TEMP/rpc.out" | jq -se 'map(select(.id == "1" and .success == true)) | length == 1 and (.[0].data.commands | all(.source != "skill"))'

  release:
    needs: [plan, boot]
    if: needs.plan.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist/release
      - name: Verificar lo que se publica
        working-directory: dist/release
        run: sha256sum -c checksums.txt
      - name: Publicar
        if: github.ref == 'refs/heads/main' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" dist/release/* --generate-notes --target "$GITHUB_SHA"
